<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pako Studios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --fondo: #070707;
    --texto: #ffffff;
    --gris: #a1a1aa;
    --gris2: #71717a;
    --vidrio: rgba(255,255,255,.08);
    --vidrio2: rgba(255,255,255,.16);
    --rojo1: #9f1239;
    --rojo2: #e11d48;
    --discord: #5865F2;
    --ease: cubic-bezier(.22,1,.36,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Poppins', sans-serif; background: var(--fondo); color: var(--texto); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  button, input { font-family: inherit; }
  input { width: 100%; border: none; background: var(--vidrio); color: #fff; font-size: 14px; outline: none; transition: background .2s, box-shadow .2s; }
  input::placeholder { color: #d1d5db; opacity: .7; }
  input:focus { background: var(--vidrio2); box-shadow: 0 0 0 2px rgba(156,163,175,.7); }

  /* ===== Fondo: las manos ===== */
  .fondo { position: fixed; inset: -3%; background: #000 url('imagenes/fondo-manos.jpg') center 50% / cover no-repeat; opacity: .8; animation: deriva 22s ease-in-out infinite alternate; }
  @keyframes deriva { from { transform: scale(1); } to { transform: scale(1.06); } }
  .tinte { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 60% 40% at 50% 50%, rgba(159,18,57,.18), transparent 70%),
                linear-gradient(to bottom, rgba(58,7,16,.55) 0%, rgba(7,7,7,.15) 35%, rgba(7,7,7,.2) 60%, rgba(7,7,7,.95) 100%); }
  .ruido { position: fixed; inset: 0; pointer-events: none; opacity: .5; background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); }

  /* La foto queda justo donde se tocan los dedos */
  .pako { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center;
    padding-top: calc(50vh - 58px); padding-bottom: 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  .chispa { position: relative; width: 116px; height: 116px; border-radius: 50%; padding: 4px; z-index: 2; animation: brinca 3.5s ease-in-out infinite; }
  .chispa::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, var(--rojo1), #ffffff, var(--rojo2), #ffffff, var(--rojo1)); animation: gira 5s linear infinite; }
  .chispa::after { content: ""; position: absolute; inset: -18px; border-radius: 50%; background: radial-gradient(circle, rgba(225,29,72,.55), transparent 65%); z-index: -1; animation: halo 2.8s ease-in-out infinite; }
  .chispa img { position: relative; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; border: 3px solid var(--fondo); }
  .chispa .punto { position: absolute; right: 6px; bottom: 8px; width: 22px; height: 22px; border-radius: 50%; background: #23a55a; border: 4px solid var(--fondo); }
  @keyframes gira { to { transform: rotate(360deg); } }
  @keyframes brinca { 50% { translate: 0 -6px; } }
  @keyframes halo { 0%,100% { transform: scale(.9); opacity: .6; } 50% { transform: scale(1.15); opacity: 1; } }

  /* ===== Tarjeta ===== */
  .tarjeta { width: 100%; max-width: 400px; margin-top: -50px; padding: 66px 28px 28px; border-radius: 28px; text-align: center;
    background: linear-gradient(to bottom, rgba(20,8,11,.72), rgba(10,10,10,.88)); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.08); box-shadow: 0 30px 60px rgba(0,0,0,.6); display: grid; gap: 18px;
    animation: sube .9s .1s var(--ease) both; }
  .brilla { text-transform: uppercase; letter-spacing: 1px;
    background: linear-gradient(90deg, #ffffff 0%, #e11d48 25%, #ffffff 50%, #9f1239 75%, #ffffff 100%); background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
    animation: brillo 3s linear infinite; filter: drop-shadow(0 0 6px rgba(225,29,72,.8)) drop-shadow(0 0 16px rgba(159,18,57,.6)); }
  @keyframes brillo { to { background-position: -200% center; } }
  .tarjeta h1 { font-size: 28px; font-weight: 800; line-height: 1.1; }
  .rol { font-size: 13.5px; color: var(--gris); margin-top: -10px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .chips span { font-size: 12px; padding: 6px 12px; border-radius: 99px; border: 1px solid rgba(225,29,72,.5); color: #fecdd3; background: rgba(159,18,57,.12); }

  .botones { display: grid; gap: 10px; }
  .boton { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 18px; border-radius: 99px; font-size: 14px; font-weight: 600; text-decoration: none; color: #fff; transition: filter .2s, transform .15s, background .2s; }
  .boton:active { transform: scale(.98); }
  .boton:focus-visible, .discord:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .boton svg { width: 18px; height: 18px; flex: none; }
  .boton.wa { background: #25D366; color: #052e16; }
  .boton.wa:hover { filter: brightness(1.1); }
  .boton.pkv { background: linear-gradient(135deg, #9f1239, #e11d48); box-shadow: 0 8px 24px rgba(225,29,72,.4); }
  .boton.pkv:hover { filter: brightness(1.1); }
  .boton.entra { background: var(--vidrio); border: 1px solid rgba(255,255,255,.1); }
  .boton.entra:hover { background: rgba(255,255,255,.16); }

  /* Etiqueta de Discord (igual que en el acceso) */
  .discord { position: relative; width: 100%; padding: 0; cursor: pointer; text-align: left; color: #fff; background: #2b2d31; border: 2px solid var(--discord); border-radius: 18px;
    box-shadow: 0 10px 30px rgba(88,101,242,.35); transition: filter .2s; }
  .discord:hover { filter: brightness(1.1); }
  .discord .banner { display: block; height: 52px; border-radius: 16px 16px 0 0; background: #111 url('imagenes/discord-banner.jpg') center 30% / cover; }
  .discord .fila { display: flex; align-items: flex-end; gap: 10px; padding: 0 12px 10px; margin-top: -20px; }
  .discord .ava { position: relative; width: 48px; height: 48px; flex: none; border-radius: 50%; border: 3px solid #2b2d31; background: #111 url('imagenes/discord-avatar.jpg') center / cover; }
  .discord .ava i { position: absolute; right: -3px; bottom: -3px; width: 14px; height: 14px; border-radius: 50%; background: #23a55a; border: 3px solid #2b2d31; }
  .discord .datos { flex: 1; min-width: 0; padding-top: 22px; }
  .discord small { display: flex; align-items: center; gap: 5px; font-size: 10.5px; opacity: .85; line-height: 1.3; white-space: nowrap; }
  .discord small svg { width: 14px; height: 14px; flex: none; }
  .discord b { display: block; font-size: 15px; font-weight: 700; line-height: 1.25; }
  .discord .chip { font-size: 10px; font-weight: 500; background: var(--discord); padding: 5px 10px; border-radius: 99px; white-space: nowrap; }

  .pie { font-size: 12px; color: var(--gris2); }

  .tarjeta { max-width: 420px; }
  .chips span { font-size: 11.5px; }
  /* Celular: las manos arriba y la foto en medio de los dedos */
  @media (max-aspect-ratio: 1/1) {
    .fondo { background-size: 220% auto; background-position: center top; }
    .pako { padding-top: 182px; padding-bottom: 120px; }
    .vale-boton { width: 60px; height: 60px; }
    .hud { width: 60px; height: 60px; }
    .hud .orbe { width: 48px; height: 48px; }
  }
  @keyframes sube { from { opacity: 0; transform: translateY(18px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  /* ===== Vale, asistente IA ===== */
  .vale-boton { position: fixed; z-index: 50; right: calc(20px + env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    width: 72px; height: 72px; border-radius: 50%; border: 1px solid rgba(225,29,72,.35); cursor: pointer; color: #fff;
    background: radial-gradient(circle, #2a0a12 0%, #0b0b0b 75%); font: 700 24px Poppins, sans-serif; display: grid; place-items: center;
    box-shadow: 0 10px 30px rgba(225,29,72,.5); animation: valeLate 2.6s ease-in-out infinite; transition: transform .2s var(--ease); }
  .vale-boton:hover { transform: scale(1.07); }
  .vale-boton:focus-visible, .vale-envia:focus-visible, .vale-chip:focus-visible, .vale-cierra:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  @keyframes valeLate { 50% { box-shadow: 0 10px 30px rgba(225,29,72,.5), 0 0 0 10px rgba(225,29,72,0); } 0%,100% { box-shadow: 0 10px 30px rgba(225,29,72,.5), 0 0 0 0 rgba(225,29,72,.55); } }
  .vale-hola { position: fixed; z-index: 50; right: calc(104px + env(safe-area-inset-right, 0px)); bottom: calc(42px + env(safe-area-inset-bottom, 0px));
    background: #fff; color: #111; font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 14px 14px 4px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
    transform-origin: right bottom; pointer-events: none; min-height: 34px; }
  .vale-panel { position: fixed; z-index: 60; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(104px + env(safe-area-inset-bottom, 0px));
    width: min(370px, calc(100vw - 32px)); height: min(540px, calc(100vh - 130px)); display: flex; flex-direction: column;
    background: #120a0c; border: 1px solid rgba(225,29,72,.45); border-radius: 22px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.6), 0 0 40px rgba(159,18,57,.35); animation: sube .4s var(--ease); }

  /* Orbe animado de Vale (estilo bloom) */
  .orbe { position: relative; display: block; width: 40px; height: 40px; }
  .orbe i { position: absolute; inset: 0; border-radius: 50%; mix-blend-mode: screen; }
  .orbe i:nth-child(1) { background: radial-gradient(circle at 30% 30%, #ff6b81, #e11d48 40%, transparent 70%); filter: blur(3px); animation: orbeA 3.2s ease-in-out infinite; }
  .orbe i:nth-child(2) { background: radial-gradient(circle at 70% 65%, #ffffff, #fda4af 25%, transparent 60%); filter: blur(3px); animation: orbeB 4.1s ease-in-out infinite; }
  .orbe i:nth-child(3) { background: conic-gradient(from 0deg, #9f1239, #e11d48, #ffffff, #e11d48, #9f1239); border-radius: 43% 57% 52% 48% / 48% 41% 59% 52%; filter: blur(6px); opacity: .75; animation: orbeGira 5s linear infinite; }
  .orbe::after { content: ""; position: absolute; inset: 32%; border-radius: 50%; background: #fff; filter: blur(4px); animation: orbeLatido 2.2s ease-in-out infinite; }
  @keyframes orbeA { 0%,100% { transform: translate(-12%, -6%) scale(1); } 50% { transform: translate(10%, 8%) scale(1.18); } }
  @keyframes orbeB { 0%,100% { transform: translate(8%, 6%) scale(.9); } 50% { transform: translate(-10%, -10%) scale(1.12); } }
  @keyframes orbeGira { to { transform: rotate(360deg); } }
  @keyframes orbeLatido { 50% { transform: scale(.65); opacity: .7; } }
  .vale-x { display: none; font-size: 24px; line-height: 1; }
  .vale-boton.abierto .orbe { display: none; }
  .vale-boton.abierto .vale-x { display: block; }
  .vale-ava .orbe { width: 28px; height: 28px; }

  /* HUD tipo Jarvis */
  .hud { position: relative; width: 64px; height: 64px; display: grid; place-items: center; animation: respira 3.2s ease-in-out infinite; }
  .anillo { position: absolute; border-radius: 50%; border: 2px solid transparent; }
  .anillo.a1 { inset: 0; border-top-color: #ff6b81; border-bottom-color: #ff6b81; animation: orbeGira 3s linear infinite; filter: drop-shadow(0 0 4px #e11d48); }
  .anillo.a2 { inset: 6px; border: 1.5px dashed rgba(255,255,255,.55); animation: orbeGira 9s linear infinite reverse; }
  .anillo.a3 { inset: 11px; border-left-color: #e11d48; border-right-color: rgba(255,255,255,.75); animation: orbeGira 2s linear infinite; }
  .hud .orbe { width: 32px; height: 32px; }
  @keyframes respira { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  .vale-boton::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid #e11d48; animation: onda 2.6s ease-out infinite; pointer-events: none; }
  @keyframes onda { from { transform: scale(1); opacity: .7; } to { transform: scale(1.7); opacity: 0; } }
  .vale-boton.abierto .hud { display: none; }
  .vale-boton.abierto::after { display: none; }
  .vale-ava .hud { width: 44px; height: 44px; }
  .vale-ava .anillo.a2 { inset: 4px; } .vale-ava .anillo.a3 { inset: 8px; }
  .vale-ava .hud .orbe { width: 22px; height: 22px; }
  /* Cuando Vale habla, todo se acelera */
  .vale-habla .anillo.a1 { animation-duration: .9s; }
  .vale-habla .anillo.a2 { animation-duration: 3s; }
  .vale-habla .anillo.a3 { animation-duration: .6s; }
  .vale-habla .hud { animation-duration: .9s; }
  .vale-habla .orbe::after { animation-duration: .5s; }
  .vale-hola.cambia { animation: pop .4s var(--ease); }

  /* Solo orbe respirando, sin contorno */
  .vale-boton { background: transparent; border: none; box-shadow: none; animation: none; }
  .vale-boton::after { display: none; }
  .vale-boton:hover { transform: scale(1.05); }
  .vale-boton.abierto { background: #1a0508; border: 1px solid rgba(225,29,72,.4); }
  .hud { width: 72px; height: 72px; animation: respira 3.6s ease-in-out infinite; }
  .hud .orbe { width: 60px; height: 60px; }
  @keyframes respira {
    0%,100% { transform: scale(.9); filter: drop-shadow(0 0 6px rgba(225,29,72,.45)); }
    50% { transform: scale(1.1); filter: drop-shadow(0 0 22px rgba(225,29,72,.95)) drop-shadow(0 0 40px rgba(255,107,129,.4)); }
  }
  .vale-ava { background: transparent !important; border: none !important; }
  .vale-ava .hud { width: 44px; height: 44px; }
  .vale-ava .hud .orbe { width: 36px; height: 36px; }
  .vale-habla .hud { animation-duration: 1.1s; }

  /* Etiqueta fija de Vale, estilo Discord */
  .vale-hola { background: #2b2d31; color: #fff; border: 2px solid var(--discord); border-radius: 14px 14px 4px 14px; padding: 8px 14px 9px;
    box-shadow: 0 10px 28px rgba(88,101,242,.4); display: grid; gap: 2px; min-height: 0; max-width: calc(100vw - 140px);
    right: calc(96px + env(safe-area-inset-right, 0px)); bottom: calc(34px + env(safe-area-inset-bottom, 0px));
    animation: pop .6s 1s var(--ease) both; }
  .vale-hola::after { content: ""; position: absolute; right: -10px; bottom: 6px; border: 8px solid transparent; border-left-color: var(--discord); border-right: 0; }
  .vale-tag { display: flex; align-items: center; gap: 7px; }
  .vale-tag b { font-size: 15px; font-weight: 800; line-height: 1.2; }
  .vale-tag em { display: inline-flex; align-items: center; gap: 2px; font-style: normal; font-size: 10px; font-weight: 600; background: var(--discord); color: #fff; padding: 1px 6px 1px 4px; border-radius: 4px; line-height: 1.5; }
  .vale-tag em svg { width: 10px; height: 10px; }
  .vale-hola small { font-size: 11.5px; color: #b5bac1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Etiqueta blanca con contorno rojo */
  .vale-hola { background: #ffffff; border-color: #e11d48; box-shadow: 0 10px 28px rgba(225,29,72,.45); }
  .vale-hola::after { border-left-color: #e11d48; }
  .vale-tag b.brilla { background-image: linear-gradient(90deg, #9f1239 0%, #e11d48 25%, #ff6b81 50%, #e11d48 75%, #9f1239 100%); filter: drop-shadow(0 0 4px rgba(225,29,72,.35)); }
  .vale-tag em { background: #e11d48; text-transform: uppercase; letter-spacing: .4px; }
  .vale-hola small { color: #52525b; }

  .vale-contacto { display: flex; gap: 8px; padding: 0 12px 10px; }
  .vale-link { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 600; color: #fff; text-decoration: none; transition: filter .2s, transform .15s; }
  .vale-link:hover { filter: brightness(1.12); }
  .vale-link:active { transform: scale(.97); }
  .vale-link:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .vale-link svg { width: 16px; height: 16px; flex: none; }
  .vale-link.wa { background: #25D366; color: #052e16; }
  .vale-link.dc { background: var(--discord); }
  .vale-cabeza { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: linear-gradient(90deg, #3a0710, #1a0508); border-bottom: 1px solid rgba(255,255,255,.08); }
  .vale-ava { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; background: radial-gradient(circle, #2a0a12 0%, #0b0b0b 75%); border: 1px solid rgba(225,29,72,.5); position: relative; }
  .vale-ava::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; background: #23a55a; border: 2px solid #1a0508; }
  .vale-cabeza .brilla { font-size: 17px; font-weight: 800; display: block; line-height: 1.1; }
  .vale-cabeza small { font-size: 11.5px; color: var(--gris); }
  .vale-cierra { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer; background: rgba(255,255,255,.08); color: #fff; font-size: 18px; line-height: 1; }
  .vale-cierra:hover { background: rgba(255,255,255,.16); }
  .vale-msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .vale-msg { max-width: 85%; padding: 10px 14px; font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .vale-msg.vale { align-self: flex-start; background: #2a161b; border-radius: 16px 16px 16px 4px; }
  .vale-msg.tu { align-self: flex-end; background: linear-gradient(135deg, #9f1239, #e11d48); border-radius: 16px 16px 4px 16px; }
  .vale-msg.pensando { color: var(--gris); font-style: italic; }
  .vale-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; }
  .vale-chip { border: 1px solid rgba(225,29,72,.5); background: transparent; color: #fecdd3; font-size: 12px; padding: 6px 12px; border-radius: 99px; cursor: pointer; }
  .vale-chip:hover { background: rgba(225,29,72,.15); }
  [hidden] { display: none !important; }
  .vale-form { display: flex; flex-direction: row; align-items: center; gap: 8px; padding: 12px; border-top: 1px solid rgba(255,255,255,.08); }
  .vale-form input { flex: 1; min-width: 0; padding: 11px 16px; border-radius: 99px; }
  .vale-envia { width: 42px; height: 42px; flex: none; border-radius: 50%; border: none; cursor: pointer; color: #fff; background: linear-gradient(135deg, #9f1239, #e11d48); display: grid; place-items: center; }
  .vale-envia:disabled { opacity: .5; cursor: default; }
  .vale-envia svg { width: 18px; height: 18px; }
</style>
</head>
<body>

<div class="fondo"></div>
<div class="tinte"></div>
<div class="ruido"></div>

<main class="pako">
  <div class="chispa"><img src="imagenes/foto-pako.jpg" alt="Pako"><span class="punto"></span></div>

  <section class="tarjeta">
    <h1 class="brilla">PakoStudios</h1>

    <div class="chips">
      <span>Páginas web</span>

    <div class="botones">
      <a class="boton wa" href="https://wa.me/525534485449?text=Hola%20Pako%2C%20vi%20tu%20tarjeta%20de%20PakoStudios" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.8-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.2z"/></svg>
        WhatsApp · 55 3448 5449
      </a>

      <button class="discord" type="button" id="discord" title="Copiar mi usuario de Discord">
        <span class="banner"></span>

<script>
  // ===== Discord: copiar usuario =====
  var pakoDiscord = "pako.444";
  document.getElementById("discord").onclick = function () {
    var chip = document.getElementById("discordChip"), txt = document.getElementById("discordTxt");
    function listo() {
      chip.textContent = "¡Copiado! ✓"; txt.textContent = "Búscame en Discord";
      setTimeout(function () { chip.textContent = "Copiar"; txt.textContent = "Contáctame por Discord"; }, 2200);
    }
    try { navigator.clipboard.writeText(pakoDiscord).then(listo, listo); } catch (e) { listo(); }
  };
  // ===== Vale, asistente IA =====
  var pakoVale = null, pako5 = [], pakoOcupada = false;
  var pakoReglas = "Eres Vale, la asistente virtual de PakoStudios (también PakitoStudios), un pequeño estudio digital de Pako en el Estado de México. " +
    "PakoStudios hace páginas web, apps, edición de videos, invitaciones digitales (XV años, bodas, cumpleaños), branding (logos e identidad), diseño gráfico y más, para negocios y personas. Pako tiene 17 años y es Técnico en Programación. " +
    "Habla en español mexicano, amable, cercana y breve (máximo 3 o 4 frases). Puedes usar algún emoji, sin exagerar. " +
    "No inventes precios, fechas ni promociones: si preguntan cuánto cuesta o cuándo queda, di que Pako cotiza según el proyecto y que le escriban por WhatsApp (55 3448 5449) o Discord (pako.444) con los botones verde y morado que están abajo del chat. " +
    "Si preguntan por la cuenta o el acceso, explica que pueden entrar con su correo y contraseña o crear una cuenta gratis en esta misma página. " +
    "Si preguntan algo fuera de tema, responde corto y regresa a cómo PakoStudios puede ayudar.";

  try { if (window.claude && window.claude.use) window.claude.use("sample").then(function (s) { pakoVale = s; }); } catch (e) {}

  function pakoBurbuja(quien, txt) {
    var b = document.createElement("div");
    b.className = "vale-msg " + quien; b.textContent = txt;
    var m = document.getElementById("valeMsgs"); m.appendChild(b); m.scrollTop = m.scrollHeight;
    return b;
  }
  // Escribe letra por letra
  function pakoTeclea(el, txt, cb) {
    clearTimeout(el._t); var pako7 = Array.from(txt), n = 0;
    document.body.classList.add("vale-habla");
    (function paso() {
      el.textContent = pako7.slice(0, n++).join("");
      var m = document.getElementById("valeMsgs"); m.scrollTop = m.scrollHeight;
      if (n <= pako7.length) el._t = setTimeout(paso, 28);
      else { document.body.classList.remove("vale-habla"); if (cb) cb(); }
    })();
  }

  // Mensajitos que cambian en el globo
  var pakoHolas = ["¡Hola! Soy Vale 👋", "¿Quieres una página web? 💻", "Invitaciones digitales ✨", "Branding para tu negocio 🎨", "Pregúntame lo que quieras 🤖"], pakoH = 0;
  function pakoHolaSig() {
    if (!document.getElementById("valePanel").hidden) return;
    var h = document.getElementById("valeHola");
    h.hidden = false; h.classList.remove("cambia"); void h.offsetWidth; h.classList.add("cambia");
    pakoTeclea(h, pakoHolas[pakoH++ % pakoHolas.length]);
  }
  var pakoSaludo = false;

  function pakoAbre(si) {
    document.getElementById("valePanel").hidden = !si;
    if (si && !pakoSaludo) { pakoSaludo = true; pakoTeclea(pakoBurbuja("vale", ""), "¡Hola! Soy Vale, la asistente de PakoStudios 💫 ¿En qué te ayudo hoy?"); }
    document.getElementById("valeBoton").classList.toggle("abierto", si);
    if (si) document.getElementById("valeTxt").focus();
  }
  document.getElementById("valeBoton").onclick = function () { pakoAbre(document.getElementById("valePanel").hidden); };
  document.getElementById("valeCierra").onclick = function () { pakoAbre(false); };
  document.querySelectorAll(".vale-chip").forEach(function (c) { c.onclick = function () { pakoPregunta(c.textContent); }; });
  // Discord: copia el usuario al abrir el link
  document.getElementById("valeDc").addEventListener("click", function () {
    try { navigator.clipboard.writeText("pako.444").catch(function () {}); } catch (e) {}
  });
  document.getElementById("valeForm").onsubmit = function (e) {
    e.preventDefault();
    var t = document.getElementById("valeTxt"), v = t.value.trim();
    if (v) { t.value = ""; pakoPregunta(v); }
  };

  function pakoPregunta(texto) {
    if (pakoOcupada) return;
    document.getElementById("valeChips").hidden = true;
    pakoBurbuja("tu", texto);
    pako5.push({ role: "user", content: texto });
    var b = pakoBurbuja("vale pensando", "Vale está escribiendo...");
    if (!pakoVale) {
      b.className = "vale-msg vale";
      pakoTeclea(b, "Ahorita no me puedo conectar desde aquí 😅. Escríbele directo a Pako por WhatsApp o Discord con los botones de abajo 👇");
      pako5.pop(); return;
    }
    pakoOcupada = true; document.getElementById("valeEnvia").disabled = true; document.body.classList.add("vale-habla");
    var pako6 = pako5.slice(-10).map(function (x) { return { role: x.role, content: x.content }; });
    if (pako6[0].role !== "user") pako6.shift();
    pako6[0].content = pakoReglas + "\n\nConversación con el visitante. Su mensaje:\n" + pako6[0].content;
    pakoVale(pako6, { cache: false, modelTier: "quick", onText: function (e) {
      if (e.text) { b.className = "vale-msg vale"; b.textContent = e.text; var m = document.getElementById("valeMsgs"); m.scrollTop = m.scrollHeight; }
    } }).then(function (r) {
      b.className = "vale-msg vale"; b.textContent = r.text || b.textContent;
      pako5.push({ role: "assistant", content: b.textContent });
    }).catch(function (err) {
      b.className = "vale-msg vale";
      var c = err && err.code;
      b.textContent = c === "not_granted" ? "Necesito que me des permiso para contestar. Mientras, Pako te atiende por WhatsApp o Discord con los botones de abajo 👇"
        : c === "rate_limited" ? "Me llegaron muchos mensajes 😵 Dame unos segundos y vuelve a preguntar."
        : "Algo falló de mi lado. Intenta otra vez o escríbele a Pako por WhatsApp o Discord con los botones de abajo 👇";
      pako5.pop();
    }).then(function () { pakoOcupada = false; document.getElementById("valeEnvia").disabled = false; document.body.classList.remove("vale-habla"); });
  }

  document.oncontextmenu = function () { return false; };
</script>
